listen:
  http: ":8080"
  admin: ":9000"

admin:
  # Set BOUINE_ADMIN_TOKEN in the environment (or .env file at the repo
  # root) to rotate this token without editing a committed file.
  # CI: inject via a repository secret → BOUINE_ADMIN_TOKEN env var.
  token: "loadtest-token"
  # Enabled for the PGO capture legs (bench/pgo/run.sh) and general
  # profiling under load. The admin port is not published beyond
  # localhost:9000 in this topology.
  pprof_enabled: true

storage:
  hot_max_bytes: 1GiB

# The H1 fast path (zero-allocation HTTP/1.1 parser serving cache hits,
# bypassing the fasthttp middleware chain) is the default path since
# ADR-0069 — no flag needed. Benchmarks against nginx/varnish/envoy
# exercise it by construction.

upstream_pools:
  - name: origin
    targets:
      - "origin:8080"
    health:
      passive:
        consecutive_5xx: 10
        # Explicit so harness behavior is pinned: the built-in default is
        # the same 30s, but the load-test topology must not depend on
        # built-in defaults. Without a window, one transient error burst
        # used to eject the single origin target for the rest of the run
        # (measured: 22 errors -> 53k instant 502s in one leg).
        eject_for: "30s"

routes:
  - name: "default"
    match:
      path_prefix: "/"
    pool: origin
    cache:
      negative_ttl: "5s"
      stale_while_revalidate: "30s"
      jitter_percent: 5
